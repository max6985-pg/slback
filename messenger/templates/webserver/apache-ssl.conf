# onepin 비공개 메신저 (install.sh 가 생성) — Cloudflare 원본 인증서 사용
# Cloudflare SSL/TLS 모드: Full (strict)
# 필요 모듈: ssl, proxy, proxy_http, proxy_wstunnel, headers, rewrite
#   proxy_wstunnel 이 없으면 통화 신호(웹소켓)가 연결되지 않는다.

<VirtualHost *:80>
    ServerName ${MATRIX_HOST}
    ServerAlias ${CHAT_HOST}
    ServerAlias ${CALL_HOST}
    RewriteEngine On
    # 인증서 갱신(ACME)만 빼고 HTTPS 로 보낸다
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# Synapse (메신저 서버)
<VirtualHost *:443>
    ServerName ${MATRIX_HOST}
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    SSLEngine on
    SSLCertificateFile    ${CERT_DIR}/origin.pem
    SSLCertificateKeyFile ${CERT_DIR}/origin.key

    AllowEncodedSlashes NoDecode
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 0

    # 서버 위치 안내는 정적 파일로 직접 내준다.
    # Synapse 의 serve_server_wellknown 은 SERVER_NAME:443 을 내주는데,
    # 그 도메인이 다른 사이트면 통화 인증이 그쪽으로 가서 실패한다.
    ProxyPass /.well-known/matrix/server !
    Alias /.well-known/matrix/server ${WELLKNOWN_DIR}/server
    <Directory ${WELLKNOWN_DIR}>
        Require all granted
    </Directory>
    <Location "/.well-known/matrix/server">
        Header always set Content-Type "application/json"
        Header always set Access-Control-Allow-Origin "*"
    </Location>

    # ── 통화 ──
    # 신호용 웹소켓. mod_rewrite 가 mod_proxy 보다 먼저 돌기 때문에 여기서 잡아야 한다.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/livekit/sfu/?(.*)$ ws://127.0.0.1:7880/$1 [P,L]
    ProxyPass        /livekit/sfu/ http://127.0.0.1:7880/
    ProxyPassReverse /livekit/sfu/ http://127.0.0.1:7880/
    # 통화 입장권 발급. Element X 가 이 주소로 직접 요청한다.
    RewriteRule ^/livekit/jwt$ /livekit/jwt/ [R=301,L]
    ProxyPass        /livekit/jwt/ http://127.0.0.1:${JWT_PORT}/
    ProxyPassReverse /livekit/jwt/ http://127.0.0.1:${JWT_PORT}/

    ProxyPass        /.well-known/matrix http://127.0.0.1:${SYNAPSE_PORT}/.well-known/matrix nocanon
    ProxyPassReverse /.well-known/matrix http://127.0.0.1:${SYNAPSE_PORT}/.well-known/matrix
    ProxyPass        /_matrix        http://127.0.0.1:${SYNAPSE_PORT}/_matrix nocanon
    ProxyPassReverse /_matrix        http://127.0.0.1:${SYNAPSE_PORT}/_matrix
    ProxyPass        /_synapse/client http://127.0.0.1:${SYNAPSE_PORT}/_synapse/client nocanon
    ProxyPassReverse /_synapse/client http://127.0.0.1:${SYNAPSE_PORT}/_synapse/client
    ProxyPass        /_synapse/admin http://127.0.0.1:${SYNAPSE_PORT}/_synapse/admin nocanon
    ProxyPassReverse /_synapse/admin http://127.0.0.1:${SYNAPSE_PORT}/_synapse/admin
</VirtualHost>

# Element 웹 (브라우저 채팅 화면)
<VirtualHost *:443>
    ServerName ${CHAT_HOST}
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    # 통화하려면 카메라·마이크를 이 사이트에는 허용해야 한다 (막으면 통화가 안 된다)
    Header always set Permissions-Policy "geolocation=(), camera=(self), microphone=(self), display-capture=(self), interest-cohort=()"
    SSLEngine on
    SSLCertificateFile    ${CERT_DIR}/origin.pem
    SSLCertificateKeyFile ${CERT_DIR}/origin.key

    ProxyPreserveHost On
    ProxyRequests Off
    # 관리자 화면 (브라우저에서 사용자 추가). 슬래시가 없으면 Element 쪽으로 새어 404 가 난다
    RewriteEngine On
    RewriteRule ^/admin$ /admin/ [R=301,L]
    ProxyPass        /admin/ http://127.0.0.1:${ADMIN_PORT}/
    ProxyPassReverse /admin/ http://127.0.0.1:${ADMIN_PORT}/
    ProxyPass        / http://127.0.0.1:${ELEMENT_PORT}/
    ProxyPassReverse / http://127.0.0.1:${ELEMENT_PORT}/
</VirtualHost>

# PC 브라우저 통화 화면 (Element Call) — 자체 호스팅
# 하위 경로(chat/call/)로는 설치할 수 없다. 빌드된 자원이 / 기준이라 경로가 깨진다.
<VirtualHost *:443>
    ServerName ${CALL_HOST}
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Permissions-Policy "geolocation=(), camera=(self), microphone=(self), display-capture=(self), interest-cohort=()"
    # 통화 화면은 채팅 화면 안에 끼워져 열린다 — 우리 채팅 화면에서만 허용
    Header always set Content-Security-Policy "frame-ancestors 'self' https://${CHAT_HOST}"
    # 전역 설정의 X-Frame-Options 가 붙으면 삽입이 막힌다. 허용 범위는 위 CSP 한 줄로만 관리.
    Header always unset X-Frame-Options
    Header unset X-Frame-Options
    SSLEngine on
    SSLCertificateFile    ${CERT_DIR}/origin.pem
    SSLCertificateKeyFile ${CERT_DIR}/origin.key

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:${CALL_PORT}/
    ProxyPassReverse / http://127.0.0.1:${CALL_PORT}/
</VirtualHost>
