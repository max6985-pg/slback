# onepin 비공개 메신저 (install.sh 가 생성) — Cloudflare 원본 인증서 사용
# Cloudflare SSL/TLS 모드: Full (strict)

server {
    listen 80;
    server_name ${MATRIX_HOST} ${CHAT_HOST};
    return 301 https://$host$request_uri;
}

# Synapse (메신저 서버)
server {
    listen 443 ssl;
    server_name ${MATRIX_HOST};

    # 보안 헤더: HTTPS 강제, 주소 유출 방지, 불필요한 브라우저 권한 차단
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;

    ssl_certificate     ${CERT_DIR}/origin.pem;
    ssl_certificate_key ${CERT_DIR}/origin.key;

    client_max_body_size ${MAX_UPLOAD_SIZE};

    location ~ ^(/_matrix|/_synapse/client) {
        proxy_pass http://127.0.0.1:${SYNAPSE_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
    }

    location / {
        return 404;
    }
}

# Element 웹 (브라우저 채팅 화면)
server {
    listen 443 ssl;
    server_name ${CHAT_HOST};

    # 보안 헤더: HTTPS 강제, 주소 유출 방지, 불필요한 브라우저 권한 차단
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;

    ssl_certificate     ${CERT_DIR}/origin.pem;
    ssl_certificate_key ${CERT_DIR}/origin.key;

    location / {
        proxy_pass http://127.0.0.1:${ELEMENT_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
