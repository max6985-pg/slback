# Synapse 설정 (install.sh 가 .env 값을 채워 data/synapse/homeserver.yaml 로 만듭니다)
# 우리끼리만 쓰는 비공개 서버: 가입 차단 + 다른 Matrix 서버와 연동(federation) 차단

server_name: "${SERVER_NAME}"
public_baseurl: "https://${MATRIX_HOST}/"
pid_file: /data/homeserver.pid
report_stats: false

listeners:
  - port: 8008
    type: http
    tls: false
    x_forwarded: true
    bind_addresses: ["0.0.0.0"]
    resources:
      - names: [client, openid]   # openid: 통화 인증 서비스가 계정을 확인할 때 쓴다
        compress: false

database:
  name: psycopg2
  args:
    user: synapse
    password: "${POSTGRES_PASSWORD}"
    database: synapse
    host: postgres
    cp_min: 5
    cp_max: 10

log_config: "/data/${SERVER_NAME}.log.config"
media_store_path: /data/media_store
signing_key_path: "/data/${SERVER_NAME}.signing.key"
max_upload_size: "${MAX_UPLOAD_SIZE}"

registration_shared_secret: "${REGISTRATION_SHARED_SECRET}"
macaroon_secret_key: "${MACAROON_SECRET_KEY}"
form_secret: "${FORM_SECRET}"

# ── 비공개 설정 ─────────────────────────────────────────────
# 누구나 가입하는 것을 막고, 관리자가 계정을 직접 만듭니다 (scripts/add-user.sh)
enable_registration: false
allow_guest_access: false

# 외부 Matrix 서버와 통신하지 않습니다 (우리 서버 사용자끼리만 대화)
federation_domain_whitelist: []
trusted_key_servers: []
allow_public_rooms_over_federation: false
allow_public_rooms_without_auth: false

# 사용자 검색은 같은 방에 있거나 같은 서버 사용자만
user_directory:
  enabled: true
  search_all_users: true

# 새 방은 기본으로 종단간 암호화
encryption_enabled_by_default_for_room_type: all

# 오래된 원격 미디어 캐시 정리 (로컬 파일은 보존)
media_retention:
  remote_media_lifetime: 90d

# ── 보안 강화 ───────────────────────────────────────────────
# 링크 미리보기 끄기: 서버가 외부 사이트에 접속해 대화 속 주소를 노출하지 않도록
url_preview_enabled: false

# 프로필(이름·사진)은 로그인한, 같은 방에 있는 사용자에게만 보여 줌
require_auth_for_profile_requests: true
limit_profile_requests_to_users_who_share_rooms: true

# 비밀번호 규칙: 12자 이상, 숫자·영문 소문자 포함
password_config:
  enabled: true
  localdb_enabled: true
  policy:
    enabled: true
    minimum_length: 12
    require_digit: true
    require_lowercase: true
    require_symbol: false
    require_uppercase: false

# 로그인 무차별 대입 방지 (같은 계정 5회 실패 시 대기)
rc_login:
  address:
    per_second: 0.1
    burst_count: 5
  account:
    per_second: 0.1
    burst_count: 5
  failed_attempts:
    per_second: 0.05
    burst_count: 5

# 푸시 알림: 메시지 내용·보낸 사람은 푸시 서버로 보내지 않음 (메시지 ID·안 읽은 수만)
push:
  include_content: false
# 사설 IP 로의 요청은 기본 차단 → 내부 푸시 서버(Sygnal) 주소 하나만 허용
ip_range_whitelist:
  - "${SYGNAL_IP}/32"

# 기록 최소화: 접속 IP 는 7일, 삭제한 메시지 원본은 1일 후 완전 삭제
user_ips_max_age: 7d
redaction_retention_period: 1d

# ─────────────── 통화(음성·영상) ───────────────
# 통화도 메시지와 같이 종단간 암호화된다. 중계 서버는 암호문만 전달한다.
app_service_config_files:
  - /data/livekit-appservice.yaml

experimental_features:
  msc4143_enabled: true    # 통화 중계 서버 위치를 앱에 알려줌
  msc4222_enabled: true    # 통화 참가 상태를 정확히 추적
  msc4502_enabled: true    # 인증 서비스가 방 참여 여부만 확인하도록 (권한 최소화)
  msc4512_enabled: true    # 통화 인증 요청을 Synapse 가 대신 전달
                           #   ↑ 이게 없으면 전달 경로 자체가 등록되지 않아 404 가 난다

# 참가 표시가 끊겨도 자동 정리되도록 (지연 이벤트)
max_event_delay_duration: 24h

# 통화는 신호가 몰려서 기본 제한에 걸린다 — 통화에 필요한 만큼만 올림 (로그인 제한은 그대로)
rc_message:
  per_second: 0.5
  burst_count: 30
rc_delayed_event_mgmt:
  per_second: 1
  burst_count: 20

matrix_rtc:
  transports:
    - type: livekit
      url: wss://${MATRIX_HOST}/livekit/sfu
      # livekit_service_url 은 "구식"으로 표시돼 있지만 빼면 안 된다.
      # Element X 26.09 는 이 값을 보고 통화를 시작한다. url 만 있으면
      # 통화 버튼은 보이는데 눌러도 서버에 요청조차 오지 않는다.
      livekit_service_url: https://${MATRIX_HOST}/livekit/jwt

# 구버전 앱은 .well-known 으로 통화 서버를 찾는다
extra_well_known_client_content:
  org.matrix.msc4143.rtc_foci:
    - type: livekit
      livekit_service_url: https://${MATRIX_HOST}/livekit/jwt

# serve_server_wellknown 은 켜지 말 것 — SERVER_NAME:443 을 내주는데,
# 그 도메인이 다른 사이트라면 통화 인증이 실패한다. 웹서버가 정적 파일로 내준다.

# ─────────────── 단체방 자동 입장 ───────────────
# 새 계정은 만들자마자 단체방에 들어간다. 방은 scripts/create-group-room.sh 로 한 번 만든다
# (방이 아직 없으면 입장만 건너뛰고 계정 생성은 정상 진행).
# 비공개 방이라 관리자 계정이 대신 초대 → 입장시킨다.
auto_join_rooms:
  - "#${GROUP_ROOM_ALIAS}:${SERVER_NAME}"
autocreate_auto_join_rooms: false
auto_join_mxid_localpart: "${ADMIN_USER}"
